<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 936" width="880" height="936" role="img" aria-labelledby="t d" data-diagram-type="sequence">
  <title id="t">PutObject sequence</title>
  <desc id="d">A client sends PUT to the handler, which calls the store. The store reads the body through the SigV4 chunk reader, streams it to a tmp file while hashing, verifies sha256 and size, fsyncs and writes meta.json, then, holding the bucket read lock and the key lock only for this commit, re-checks that the bucket exists, renames the old object out and the new one in, fsyncs the directory, updates the index, unlocks, removes the old object, and returns the ETag; the client gets 200 with the ETag. On any mismatch the tmp file is discarded and an XML error is returned.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node.store rect { fill: var(--bg); stroke: var(--muted); }
    .node.ext rect { fill: var(--bg); stroke: var(--rule); stroke-dasharray: 4 3; }
    .node.lead rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .sub { fill: var(--muted); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .edge.fail { stroke: var(--accent); }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .mask { fill: var(--bg); }
    .group rect { fill: none; stroke: var(--rule); stroke-dasharray: 4 4; }
    .group rect.mask { fill: var(--bg); stroke: none; }
    .note { fill: var(--muted); font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
    .edge.reply { stroke: var(--muted); stroke-dasharray: 6 4; }
    .edge.reply.fail { stroke: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A6580"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="936" fill="#F5F5F5"/>
  <g class="node" data-id="client"><rect x="40" y="48" width="144" height="48" rx="6"/><text class="label" x="112" y="76.9" font-size="14" text-anchor="middle">Client</text></g>
  <g class="node" data-id="handler"><rect x="208" y="48" width="144" height="48" rx="6"/><text class="label" x="280" y="76.9" font-size="14" text-anchor="middle">Handler</text></g>
  <g class="node" data-id="reader"><rect x="376" y="48" width="144" height="48" rx="6"/><text class="label" x="448" y="76.9" font-size="14" text-anchor="middle">Chunk reader</text></g>
  <g class="node" data-id="store"><rect x="544" y="48" width="144" height="48" rx="6"/><text class="label" x="616" y="76.9" font-size="14" text-anchor="middle">Store</text></g>
  <g class="node" data-id="fs"><rect x="712" y="48" width="144" height="48" rx="6"/><text class="label" x="784" y="76.9" font-size="14" text-anchor="middle">Filesystem</text></g>
  <line class="lifeline" x1="112" y1="96" x2="112" y2="848"/>
  <line class="lifeline" x1="280" y1="96" x2="280" y2="848"/>
  <line class="lifeline" x1="448" y1="96" x2="448" y2="848"/>
  <line class="lifeline" x1="616" y1="96" x2="616" y2="848"/>
  <line class="lifeline" x1="784" y1="96" x2="784" y2="848"/>
  <text class="note" x="196" y="142" font-size="12" text-anchor="middle">PUT /bucket/key</text>
  <path class="edge" data-from="client" data-to="handler" d="M112 152 H280" marker-end="url(#arrow)"/>
  <text class="note" x="448" y="198" font-size="12" text-anchor="middle">PutObject(body)</text>
  <path class="edge" data-from="handler" data-to="store" d="M280 208 H616" marker-end="url(#arrow)"/>
  <text class="note" x="532" y="254" font-size="12" text-anchor="middle">read body</text>
  <path class="edge" data-from="store" data-to="reader" d="M616 264 H448" marker-end="url(#arrow)"/>
  <text class="note" x="532" y="310" font-size="12" text-anchor="middle">verified chunks</text>
  <path class="edge reply" data-from="reader" data-to="store" d="M448 320 H616" marker-end="url(#arrow-soft)"/>
  <text class="note" x="700" y="366" font-size="12" text-anchor="middle">stream to tmp, hash</text>
  <path class="edge" data-from="store" data-to="fs" d="M616 376 H784" marker-end="url(#arrow)"/>
  <text class="note" x="607" y="436" font-size="12" text-anchor="end">verify sha256, size</text>
  <text class="note" x="700" y="478" font-size="12" text-anchor="middle">fsync, write meta</text>
  <path class="edge" data-from="store" data-to="fs" d="M616 488 H784" marker-end="url(#arrow)"/>
  <text class="note" x="700" y="534" font-size="12" text-anchor="middle">bucket+key lock</text>
  <path class="edge" data-from="store" data-to="fs" d="M616 544 H784" marker-end="url(#arrow)"/>
  <text class="note" x="700" y="590" font-size="12" text-anchor="middle">old out, new in</text>
  <path class="edge" data-from="store" data-to="fs" d="M616 600 H784" marker-end="url(#arrow)"/>
  <text class="note" x="607" y="660" font-size="12" text-anchor="end">index, fsync, unlock</text>
  <text class="note" x="700" y="702" font-size="12" text-anchor="middle">remove old</text>
  <path class="edge" data-from="store" data-to="fs" d="M616 712 H784" marker-end="url(#arrow)"/>
  <text class="note" x="448" y="758" font-size="12" text-anchor="middle">ETag</text>
  <path class="edge reply" data-from="store" data-to="handler" d="M616 768 H280" marker-end="url(#arrow-soft)"/>
  <text class="note" x="196" y="814" font-size="12" text-anchor="middle">200 OK, ETag</text>
  <path class="edge reply fail" data-from="handler" data-to="client" d="M280 824 H112" marker-end="url(#arrow-accent)"/>
  <text class="note" x="48" y="880" font-size="12">Failure: on a chunk signature, sha256, or size mismatch the store deletes the tmp file and the handler returns an XML error.</text>
  <text class="note" x="48" y="904" font-size="12">No lock is held while the body streams. If the bucket was deleted meanwhile, the stage is discarded: NoSuchBucket.</text>
</svg>
