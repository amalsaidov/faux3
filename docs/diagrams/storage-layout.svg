<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 640" width="832" height="640" role="img" aria-labelledby="t d" data-diagram-type="layers">
  <title id="t">Faux3 storage layout</title>
  <desc id="d">The /data volume holds .faux3/format (the format version, 1) and .faux3/tmp (PutObject staging), then buckets/&lt;bucket&gt;/ with a .bucket.json and an objects/ tree. Each object lives at objects/&lt;h[0:2]&gt;/&lt;h&gt;/ as a data file and a meta.json with the key, size, etag, content headers, checksums, user metadata, and lastModified. h is the lowercase hex SHA-256 of the key bytes; the key itself is read only from meta.json.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node.store rect { fill: var(--bg); stroke: var(--muted); }
    .node.ext rect { fill: var(--bg); stroke: var(--rule); stroke-dasharray: 4 3; }
    .node.lead rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .sub { fill: var(--muted); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .edge.fail { stroke: var(--accent); }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .mask { fill: var(--bg); }
    .group rect { fill: none; stroke: var(--rule); stroke-dasharray: 4 4; }
    .group rect.mask { fill: var(--bg); stroke: none; }
    .note { fill: var(--muted); font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="832" height="640" fill="#F5F5F5"/>
  <g class="group" data-id="band0"><rect x="48" y="48" width="736" height="112" rx="8"/><text class="note" x="64" y="72" font-size="12">/data/.faux3/</text>
  <g class="node" data-id="format"><rect x="80" y="88" width="320" height="48" rx="6"/><text class="label" x="240" y="116.9" font-size="14" text-anchor="middle">format, holds 1</text></g>
  <g class="node" data-id="tmp"><rect x="432" y="88" width="320" height="48" rx="6"/><text class="label" x="592" y="116.9" font-size="14" text-anchor="middle">tmp/, PutObject staging</text></g>
  </g>
  <g class="group" data-id="band1"><rect x="48" y="184" width="736" height="112" rx="8"/><text class="note" x="64" y="208" font-size="12">/data/buckets/&lt;bucket&gt;/</text>
  <g class="node" data-id="bucketjson"><rect x="80" y="224" width="320" height="48" rx="6"/><text class="label" x="240" y="252.9" font-size="14" text-anchor="middle">.bucket.json, name and created</text></g>
  <g class="node" data-id="objects"><rect x="432" y="224" width="320" height="48" rx="6"/><text class="label" x="592" y="252.9" font-size="14" text-anchor="middle">objects/, one dir per key</text></g>
  </g>
  <g class="group" data-id="band2"><rect x="48" y="320" width="736" height="112" rx="8"/><text class="note" x="64" y="344" font-size="12">objects/&lt;h[0:2]&gt;/&lt;h&gt;/</text>
  <g class="node" data-id="data"><rect x="80" y="360" width="320" height="48" rx="6"/><text class="label" x="240" y="388.9" font-size="14" text-anchor="middle">data, the object bytes</text></g>
  <g class="node" data-id="meta"><rect x="432" y="360" width="320" height="48" rx="6"/><text class="label" x="592" y="388.9" font-size="14" text-anchor="middle">meta.json, the metadata</text></g>
  </g>
  <g class="node" data-id="fields"><rect x="48" y="456" width="736" height="64" rx="6"/><text class="label" x="416" y="484.5" font-size="14" text-anchor="middle"><tspan x="416">meta.json: key, size, etag (MD5), contentType, contentEncoding,</tspan><tspan x="416" dy="16.8">checksums, userMetadata, lastModified, cache and disposition headers</tspan></text></g>
  <g class="node lead" data-id="hash"><rect x="48" y="544" width="736" height="48" rx="6"/><text class="label" x="416" y="572.9" font-size="14" text-anchor="middle">h = lowercase hex sha256(key bytes); the key itself lives only in meta.json</text></g>
</svg>
