<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 992" width="720" height="992" role="img" aria-labelledby="t d" data-diagram-type="flow">
  <title id="t">Faux3 request pipeline</title>
  <desc id="d">Each request passes through middleware (request id, logging, panic recovery). /healthz short-circuits with 200 and OPTIONS gets a CORS preflight answer. The router splits the path and resolves one of nine operations, returning 501 for anything else. SigV4 verification checks a header or presigned signature; the handler validates inputs, the payload decoder unwraps aws-chunked bodies while hashing, and the store reads or writes the filesystem. Success returns an XML response; an unsupported op, bad signature, hash mismatch, or store error returns an XML error.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node.store rect { fill: var(--bg); stroke: var(--muted); }
    .node.ext rect { fill: var(--bg); stroke: var(--rule); stroke-dasharray: 4 3; }
    .node.lead rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .sub { fill: var(--muted); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .edge.fail { stroke: var(--accent); }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .mask { fill: var(--bg); }
    .group rect { fill: none; stroke: var(--rule); stroke-dasharray: 4 4; }
    .group rect.mask { fill: var(--bg); stroke: none; }
    .note { fill: var(--muted); font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="992" fill="#F5F5F5"/>
  <path class="edge" data-from="mw" data-to="health" d="M176 112 V152" marker-end="url(#arrow)"/>
  <path class="edge" data-from="health" data-to="cors" d="M176 216 V256" marker-end="url(#arrow)"/>
  <text class="note" x="184" y="240" font-size="12" text-anchor="start">other path</text>
  <path class="edge" data-from="cors" data-to="router" d="M176 320 V360" marker-end="url(#arrow)"/>
  <text class="note" x="184" y="344" font-size="12" text-anchor="start">not OPTIONS</text>
  <path class="edge" data-from="router" data-to="sigv4" d="M176 424 V464" marker-end="url(#arrow)"/>
  <text class="note" x="184" y="448" font-size="12" text-anchor="start">one of 9 ops</text>
  <path class="edge" data-from="sigv4" data-to="handler" d="M176 528 V568" marker-end="url(#arrow)"/>
  <text class="note" x="184" y="552" font-size="12" text-anchor="start">valid</text>
  <path class="edge" data-from="handler" data-to="decode" d="M176 632 V672" marker-end="url(#arrow)"/>
  <path class="edge" data-from="decode" data-to="store" d="M176 736 V776" marker-end="url(#arrow)"/>
  <text class="note" x="184" y="760" font-size="12" text-anchor="start">hashes match</text>
  <path class="edge fail" data-from="store" data-to="resp" d="M176 840 V880" marker-end="url(#arrow-accent)"/>
  <text class="note" x="184" y="864" font-size="12" text-anchor="start">ok</text>
  <path class="edge" data-from="health" data-to="healthz" d="M304 184 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="174" font-size="12" text-anchor="middle">/healthz</text>
  <path class="edge" data-from="cors" data-to="preflight" d="M304 288 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="278" font-size="12" text-anchor="middle">OPTIONS</text>
  <path class="edge" data-from="router" data-to="err" d="M304 392 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="382" font-size="12" text-anchor="middle">unsupported</text>
  <path class="edge" data-from="sigv4" data-to="err" d="M304 496 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="486" font-size="12" text-anchor="middle">bad signature</text>
  <path class="edge" data-from="decode" data-to="err" d="M304 704 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="694" font-size="12" text-anchor="middle">hash mismatch</text>
  <path class="edge" data-from="store" data-to="err" d="M304 808 H432" marker-end="url(#arrow)"/>
  <text class="note" x="368" y="798" font-size="12" text-anchor="middle">store error</text>
  <g class="node" data-id="mw"><rect x="48" y="48" width="256" height="64" rx="6"/><text class="label" x="176" y="76.5" font-size="14" text-anchor="middle"><tspan x="176">Middleware</tspan><tspan x="176" dy="16.8">request id, log, recover</tspan></text></g>
  <g class="node" data-id="health"><rect x="48" y="152" width="256" height="64" rx="6"/><text class="label" x="176" y="180.5" font-size="14" text-anchor="middle"><tspan x="176">Health check</tspan><tspan x="176" dy="16.8">is path /healthz?</tspan></text></g>
  <g class="node" data-id="cors"><rect x="48" y="256" width="256" height="64" rx="6"/><text class="label" x="176" y="284.5" font-size="14" text-anchor="middle"><tspan x="176">CORS preflight</tspan><tspan x="176" dy="16.8">is method OPTIONS?</tspan></text></g>
  <g class="node" data-id="router"><rect x="48" y="360" width="256" height="64" rx="6"/><text class="label" x="176" y="388.5" font-size="14" text-anchor="middle"><tspan x="176">Router</tspan><tspan x="176" dy="16.8">split path, resolve op</tspan></text></g>
  <g class="node" data-id="sigv4"><rect x="48" y="464" width="256" height="64" rx="6"/><text class="label" x="176" y="492.5" font-size="14" text-anchor="middle"><tspan x="176">SigV4 verify</tspan><tspan x="176" dy="16.8">header or presigned</tspan></text></g>
  <g class="node" data-id="handler"><rect x="48" y="568" width="256" height="64" rx="6"/><text class="label" x="176" y="596.5" font-size="14" text-anchor="middle"><tspan x="176">Handler</tspan><tspan x="176" dy="16.8">validate bucket and key</tspan></text></g>
  <g class="node" data-id="decode"><rect x="48" y="672" width="256" height="64" rx="6"/><text class="label" x="176" y="700.5" font-size="14" text-anchor="middle"><tspan x="176">Payload decoder</tspan><tspan x="176" dy="16.8">aws-chunked, hashers</tspan></text></g>
  <g class="node" data-id="store"><rect x="48" y="776" width="256" height="64" rx="6"/><text class="label" x="176" y="804.5" font-size="14" text-anchor="middle"><tspan x="176">Store</tspan><tspan x="176" dy="16.8">filesystem read or write</tspan></text></g>
  <g class="node lead" data-id="resp"><rect x="48" y="880" width="256" height="64" rx="6"/><text class="label" x="176" y="908.5" font-size="14" text-anchor="middle"><tspan x="176">XML response</tspan><tspan x="176" dy="16.8">200 with body or ETag</tspan></text></g>
  <g class="node" data-id="healthz"><rect x="432" y="152" width="240" height="64" rx="6"/><text class="label" x="552" y="180.5" font-size="14" text-anchor="middle"><tspan x="552">200 OK</tspan><tspan x="552" dy="16.8">no auth, no log noise</tspan></text></g>
  <g class="node" data-id="preflight"><rect x="432" y="256" width="240" height="64" rx="6"/><text class="label" x="552" y="284.5" font-size="14" text-anchor="middle"><tspan x="552">Preflight response</tspan><tspan x="552" dy="16.8">or 403 if origin unset</tspan></text></g>
  <g class="node" data-id="err"><rect x="432" y="360" width="240" height="480" rx="6"/><text class="label" x="552" y="596.5" font-size="14" text-anchor="middle"><tspan x="552">XML error response</tspan><tspan x="552" dy="16.8">4xx, 501, or 500</tspan></text></g>
</svg>
